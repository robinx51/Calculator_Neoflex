server.port=8081
calculator.url=http://localhost:8080

spring.application.name=ms_deal
logging.file.name=logs/app.log
logging.file.path=logs

spring.datasource.url=jdbc:postgresql://localhost:5432/neoflex_calculator
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.change-log=db/changelog/changelog.xml
spring.liquibase.url=jdbc:postgresql://localhost:5432/neoflex_calculator
spring.liquibase.user=postgres
spring.liquibase.password=123

spring.h2.console.enabled=true