#Добавить application-profile.properties c данными авторизации в почту gmail
spring.profiles.active=profile
server.port=8083

logging.file.name=MS_Dossier/logs/app.log
logging.file.path=logs

spring.main.allow-bean-definition-overriding=true
spring.application.name=MS_Dossier
spring.liquibase.enabled=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.ack-mode=record

spring.kafka.producer.client-id=ms_deal
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.properties.spring.json.value.default.type=ru.deal.dto.EmailMessageDto
spring.kafka.retry.topic.delay=5s

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true