#Добавить application-profile.properties c данными авторизации в почту gmail
spring.profiles.active=profile
server.port=8083

logging.file.name=MS_Dossier/logs/app.log
logging.file.path=logs

spring.main.allow-bean-definition-overriding=true
spring.application.name=MS_Dossier

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.ack-mode=record

spring.kafka.consumer.group-id=ms-dossier-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.properties.spring.json.value.default.type=ru.library.dto.EmailMessageDto
spring.kafka.properties.spring.json.trusted.packages=java.util,java.lang,ru.library.dto,*
spring.kafka.retry.topic.delay=5s

spring.mail.username=${dossier.username}
spring.mail.password=${dossier.password}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true