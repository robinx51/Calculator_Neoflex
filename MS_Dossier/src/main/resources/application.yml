server:
  port: 8083

logging:
  file:
    path: logs
    name: logs/app.log

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: MS_Dossier
  liquibase:
    enabled: false

  kafka:
    bootstrap-servers: kafka:29092,kafka2:29093
    listener:
      # Получение каждой записи должно быть подтверждено
      ack-mode: record
    producer:
      client-id: ${spring.application.name}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Очередь для исключений
      value-serializer: ru.home.kafka.config.DltMessageSerializer
      retries: 3
    consumer:
      group-id: neoflex_bank
      autoOffsetReset: earliest
      # Сериализаторы для всех типов
      keyDeserializer: org.apache.kafka.common.serialization.StringDeserializer
      valueDeserializer: org.springframework.kafka.support.serializer.JsonDeserializer